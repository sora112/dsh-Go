name: ios-unsigned-ipa

# 版本 4：修 Xcode 太旧导致的编译错。
# 报错：connectivity_plus-7.3.2 里用了 NWPath.isUltraConstrained，那是 iOS 26 SDK 才有的 API，
# 而这台 Intel Mac 上的 Xcode 是 16 系，所以编译失败。办法是把 connectivity_plus 钉回旧版本。
# 覆盖 .github/workflows/ios-unsigned-ipa.yml，再跑一次。

on:
  workflow_dispatch:
    inputs:
      with_engine:
        description: '把本机引擎一起打进去（约 160MB；只要遥控电脑就填 no）'
        required: false
        default: 'yes'
      conn_version:
        description: 'connectivity_plus 用哪个版本（默认 6.1.4，最稳）'
        required: false
        default: '6.1.4'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 环境探底
        run: |
          uname -m || true
          xcodebuild -version || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 把 connectivity_plus 钉到旧版本
        working-directory: app
        run: |
          python3 - "${{ inputs.conn_version }}" <<'PY'
          import sys
          ver = sys.argv[1]
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          line = f'  connectivity_plus: {ver}\n'
          if 'dependency_overrides:' in s:
              head, tail = s.split('dependency_overrides:', 1)
              body = tail.split('\nsettings:', 1)
              s = head + 'dependency_overrides:\n' + line + body[0].lstrip('\n') + ('\nsettings:' + body[1] if len(body) > 1 else '')
          else:
              s = s + '\ndependency_overrides:\n' + line
          open(p, 'w', encoding='utf-8').write(s)
          print(s[-400:])
          PY

      - name: 准备本机引擎（可选）
        if: ${{ inputs.with_engine == 'yes' }}
        run: |
          chmod +x tooling/ios/prepare-engine.sh
          tooling/ios/prepare-engine.sh

      - name: 装依赖
        working-directory: app
        run: flutter pub get

      - name: 编 iOS（不签名）
        working-directory: app
        run: |
          flutter build ios --release --no-codesign

      - name: 打成 ipa
        run: |
          set -e
          APP_DIR="app/build/ios/iphoneos"
          ls -la "$APP_DIR"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP_DIR/Runner.app" Payload/
          zip -qry "out/dsh-go-unsigned.ipa" Payload
          ls -lh out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-go-unsigned-ipa
          path: out/dsh-go-unsigned-ipa
          if-no-files-found: warn
          retention-days: 7
