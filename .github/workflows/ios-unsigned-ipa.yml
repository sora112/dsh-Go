name: ios-unsigned-ipa

# 版本 2：把 runner 从 macos-26 换成 macos-15（池子大，容易派到机器），并允许重试。
# 用它覆盖仓库里 .github/workflows/ios-unsigned-ipa.yml，然后重新跑一次。

on:
  workflow_dispatch:
    inputs:
      with_engine:
        description: '把本机引擎一起打进去（约 160MB，编得慢；只要遥控电脑就填 no）'
        required: false
        default: 'no'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 环境探底
        run: |
          sw_vers || true
          xcodebuild -version || true
          python3 --version || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 准备本机引擎（可选）
        if: ${{ inputs.with_engine == 'yes' }}
        run: |
          chmod +x tooling/ios/prepare-engine.sh
          tooling/ios/prepare-engine.sh

      - name: 装依赖
        working-directory: app
        run: flutter pub get

      - name: 编 iOS（不签名）
        working-directory: app
        run: |
          flutter build ios --release --no-codesign

      - name: 打成 ipa
        run: |
          set -e
          APP_DIR="app/build/ios/iphoneos"
          ls -la "$APP_DIR"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP_DIR/Runner.app" Payload/
          zip -qry "out/dsh-go-unsigned.ipa" Payload
          ls -lh out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-go-unsigned-ipa
          path: out/dsh-go-unsigned-ipa
          if-no-files-found: warn
          retention-days: 7
