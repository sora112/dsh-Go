workflows:
  ios-unsigned:
    name: iOS 未签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      vars:
        APP_DIR: app
    scripts:
      - name: 看一下环境
        script: |
          xcodebuild -version || true
          flutter --version || true
      - name: 装依赖
        script: |
          cd "$APP_DIR"
          flutter pub get
      - name: 编 iOS（不签名）
        script: |
          cd "$APP_DIR"
          flutter build ios --release --no-codesign
      - name: 打成 ipa
        script: |
          set -e
          cd "$APP_DIR/build/ios/iphoneos"
          ls -la
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry dsh-go-unsigned.ipa Payload
          ls -lh dsh-go-unsigned.ipa
    artifacts:
      - app/build/ios/iphoneos/dsh-go-unsigned.ipa
