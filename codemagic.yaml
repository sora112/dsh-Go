workflows:
  ios-unsigned:
    name: iOS 未签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: latest
      vars:
        WITH_ENGINE: "yes"
    scripts:
      - name: 看一下环境
        script: |
          set -e
          uname -sm; sw_vers -productVersion; flutter --version | head -2

      - name: 装依赖
        script: |
          set -e
          cd app
          flutter pub get

      - name: 准备本机引擎
        script: |
          set -e
          if [ "${WITH_ENGINE}" != "yes" ]; then
            echo "WITH_ENGINE=${WITH_ENGINE}，跳过引擎"
            exit 0
          fi
          brew install python@3.11
          export PYTHON="$(brew --prefix python@3.11)/bin/python3.11"
          "$PYTHON" --version
          bash tooling/ios/prepare-engine.sh
          ls -la app/ios/Engine | head -20

      - name: 生成工程
        script: |
          set -e
          cd app
          flutter build ios --release --no-codesign --config-only
          test -d ios/Runner.xcodeproj || { echo "没有 Runner.xcodeproj"; exit 1; }

      - name: 编 iOS（关掉签名直接 xcodebuild）
        script: |
          set -e
          brew install llvm lld meson ninja
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          which ld.lld meson ninja || true
          cd app/ios
          if [ -d Runner.xcworkspace ]; then
            TARGET="-workspace Runner.xcworkspace"
          else
            TARGET="-project Runner.xcodeproj"
          fi
          echo "xcodebuild $TARGET"
          xcodebuild $TARGET \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打成 ipa
        script: |
          set -e
          APP="app/build/dd/Build/Products/Release-iphoneos/Runner.app"
          echo "app: $APP"
          test -d "$APP"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../../dsh-go-unsigned.ipa Payload)
          ls -lh dsh-go-unsigned.ipa

    artifacts:
      - dsh-go-unsigned.ipa
